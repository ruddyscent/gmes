name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Python 3.14 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          version: "0.12.5"
      - name: Install Python
        run: uv python install 3.14
      - name: Install SWIG on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libopenmpi-dev openmpi-bin swig
      - name: Install SWIG on macOS
        if: runner.os == 'macOS'
        run: brew install swig
      - name: Install Linux test dependencies
        if: runner.os == 'Linux'
        run: uv sync --locked --extra hdf5 --extra plot --extra mpi
      - name: Install macOS test dependencies
        if: runner.os == 'macOS'
        run: uv sync --locked --extra hdf5 --extra plot
      - name: Run quality checks
        run: |
          uv run --no-sync python -m isort --check-only gmes examples tests utils setup.py
          uv run --no-sync python -m black --check gmes examples tests utils setup.py
          uv run --no-sync python -m pylint gmes setup.py
      - name: Run tests
        run: uv run --no-sync python -m unittest discover -v
      - name: Run MPI deployment smoke test
        if: runner.os == 'Linux'
        run: uv run --no-sync mpiexec --oversubscribe -n 10 python tests/mpi_deployment_smoke.py
      - name: Build distributions
        run: uv build
