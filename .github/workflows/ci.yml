name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Python 3.14 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          cache-suffix: ${{ github.job }}
          enable-cache: true
          version: "0.12.5"
      - name: Install Python
        run: uv python install 3.14
      - name: Install locked CPU test environment
        run: uv sync --locked --extra torch-cpu --extra hdf5
      - name: Run quality checks
        run: |
          uv run --no-sync python -m isort --check-only gmes examples tests benchmarks utils setup.py
          uv run --no-sync python -m black --check gmes examples tests benchmarks utils setup.py
          uv run --no-sync python -m mypy
          uv run --no-sync python -m mypy.stubtest --mypy-config-file pyproject.toml gmes.constant
          uv run --no-sync python -m pylint $(git ls-files 'gmes/*.py') setup.py
      - name: Run complete supported CPU suite
        run: uv run --no-sync python -m unittest discover -v
      - name: Build pure distributions
        run: uv build
      - name: Check out candidate head for #124 package evidence
        if: runner.os == 'macOS' && github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: issue124-package-evidence-candidate
          persist-credentials: false
      - name: Build and verify candidate #124 packages
        if: runner.os == 'macOS' && github.event_name == 'pull_request'
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CANDIDATE_DIR: ${{ github.workspace }}/issue124-package-evidence-candidate
          EVIDENCE_DIR: ${{ runner.temp }}/issue-124-package-evidence
          UV_CACHE_DIR: ${{ runner.temp }}/issue-124-package-cache
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          test "$(git -C "$CANDIDATE_DIR" rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git -C "$CANDIDATE_DIR" status --porcelain=v1 --untracked-files=all)"
          mkdir -p "$EVIDENCE_DIR/packages"
          uv build --clear --no-create-gitignore --directory "$CANDIDATE_DIR" --out-dir "$EVIDENCE_DIR/packages"
          wheels=("$EVIDENCE_DIR"/packages/*.whl)
          sdists=("$EVIDENCE_DIR"/packages/*.tar.gz)
          test "${#wheels[@]}" -eq 1
          test "${#sdists[@]}" -eq 1
          test -f "${wheels[0]}"
          test -f "${sdists[0]}"
          case "${wheels[0]}" in
            *-py3-none-any.whl) ;;
            *) exit 1 ;;
          esac
          helper="$CANDIDATE_DIR/benchmarks/package_cutover.py"
          for archive in "${wheels[0]}" "${sdists[0]}"; do
            environment="$RUNNER_TEMP/gmes-issue-124-$(basename "$archive")"
            uv venv --clear --python 3.14 "$environment"
            (
              cd "$CANDIDATE_DIR"
              UV_PROJECT_ENVIRONMENT="$environment" uv sync --locked --no-install-project \
                --extra torch-cpu --extra hdf5
            )
            "$environment/bin/python" -m ensurepip
            "$environment/bin/python" -m pip --version
            "$environment/bin/python" -m pip install --no-deps \
              --constraint "$CANDIDATE_DIR/build-constraints.txt" \
              setuptools==84.0.0 wheel==0.48.0
            digest="$(shasum -a 256 "$archive" | awk '{print $1}')"
            installer=(--no-deps --no-index --force-reinstall)
            if [[ "$archive" == *.tar.gz ]]; then
              installer+=(--no-build-isolation)
            fi
            "$environment/bin/python" -m pip install "${installer[@]}" \
              "gmes @ file://${archive}#sha256=${digest}"
            (
              cd "$RUNNER_TEMP"
              "$environment/bin/python" -I "$helper" \
                --candidate-label "issue-124-macos-${CANDIDATE_SHA}-$(basename "$archive")" \
                --archive "$archive" \
                --forbidden-root "$GITHUB_WORKSPACE" \
                --forbidden-root "$CANDIDATE_DIR" \
                --device cpu \
                --required-device-count 0 \
                --evidence-dir "$EVIDENCE_DIR/$(basename "$archive")"
            )
          done
          # Hosted PR CI runs CPU package evidence only. package_cutover also
          # supports trusted installed-origin one-/two-GPU evidence elsewhere;
          # an unavailable accelerator must not be represented as success.
          test -z "$(git -C "$CANDIDATE_DIR" status --porcelain=v1 --untracked-files=all)"
      - name: Upload candidate #124 package evidence
        if: runner.os == 'macOS' && github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue-124-package-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/issue-124-package-evidence
          if-no-files-found: error
          retention-days: 90
          overwrite: true
