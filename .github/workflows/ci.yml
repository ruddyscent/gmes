name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Python 3.14 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          version: "0.12.5"
      - name: Install Python
        run: uv python install 3.14
      - name: Install SWIG on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libopenmpi-dev openmpi-bin swig
      - name: Install SWIG on macOS
        if: runner.os == 'macOS'
        run: brew install swig libomp
      - name: Install Linux test dependencies
        if: runner.os == 'Linux'
        run: uv sync --locked --extra torch-cpu --extra hdf5 --extra plot --extra mpi
      - name: Install macOS test dependencies without plot extra
        if: runner.os == 'macOS'
        run: uv sync --locked --extra torch-cpu --extra hdf5
      - name: Verify default build OpenMP support on Linux
        if: runner.os == 'Linux'
        run: uv run --no-sync python -c "from gmes import pw_material; assert pw_material.openmp_enabled()"
      - name: Verify default build serial fallback on macOS
        if: runner.os == 'macOS'
        run: uv run --no-sync python -c "from gmes import pw_material; assert not pw_material.openmp_enabled()"
      - name: Run quality checks
        run: |
          uv run --no-sync python -m isort --check-only gmes examples tests benchmarks utils setup.py
          uv run --no-sync python -m black --check gmes examples tests benchmarks utils setup.py
          uv run --no-sync python -m mypy
          uv run --no-sync python -m mypy.stubtest --mypy-config-file pyproject.toml gmes.constant gmes.pw_material
          uv run --no-sync python -m pylint $(git ls-files 'gmes/*.py') setup.py
      - name: Run tests with the default threshold
        run: uv run --no-sync python -m unittest discover -v
      - name: Run tests with forced parallel updates
        if: runner.os == 'Linux'
        run: OMP_NUM_THREADS=4 GMES_OPENMP_THRESHOLD=0 uv run --no-sync python -m unittest discover -v
      - name: Rebuild without OpenMP on Linux
        if: runner.os == 'Linux'
        run: GMES_ENABLE_OPENMP=0 uv sync --locked --extra torch-cpu --extra hdf5 --extra plot --extra mpi --reinstall-package gmes
      - name: Rebuild without OpenMP on macOS
        if: runner.os == 'macOS'
        run: GMES_ENABLE_OPENMP=0 uv sync --locked --extra torch-cpu --extra hdf5 --extra plot --reinstall-package gmes
      - name: Run tests with the serial build
        run: GMES_ENABLE_OPENMP=0 uv run --no-sync python -m unittest discover -v
      - name: Run MPI deployment smoke test
        if: runner.os == 'Linux'
        run: uv run --no-sync mpiexec --oversubscribe -n 10 python tests/mpi_deployment_smoke.py
      - name: Build distributions with required OpenMP
        if: runner.os == 'Linux'
        run: GMES_ENABLE_OPENMP=1 uv build
      - name: Build distributions with macOS auto fallback
        if: runner.os == 'macOS'
        run: GMES_ENABLE_OPENMP=auto uv build
