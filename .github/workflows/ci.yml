name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python 3.14 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install 3.14
      - name: Install SWIG on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libopenmpi-dev openmpi-bin swig
      - name: Install SWIG on macOS
        if: runner.os == 'macOS'
        run: brew install swig
      - name: Install Linux test dependencies
        if: runner.os == 'Linux'
        run: uv sync --locked --extra hdf5 --extra plot --extra mpi
      - name: Install macOS test dependencies
        if: runner.os == 'macOS'
        run: uv sync --locked --extra hdf5 --extra plot
      - name: Run quality checks
        run: |
          uv run --no-sync python -m isort --check-only gmes examples tests utils setup.py
          uv run --no-sync python -m black --check gmes examples tests utils setup.py
          uv run --no-sync python -m pylint gmes setup.py
      - name: Run tests
        run: uv run --no-sync python -m unittest discover -v
      - name: Run MPI deployment smoke test
        if: runner.os == 'Linux'
        run: uv run --no-sync mpiexec --oversubscribe -n 10 python tests/mpi_deployment_smoke.py
      - name: Build distributions
        run: uv build

  prerelease:
    name: Python prerelease
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.15-dev"
      - name: Install SWIG
        run: sudo apt-get update && sudo apt-get install --yes swig
      - name: Install and test prerelease dependencies
        run: |
          python -m pip install --upgrade --pre pip
          python -m pip install --pre --group dev -e ".[hdf5]"
          python -m unittest discover -v
