name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python 3.14 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install SWIG on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes swig
      - name: Install SWIG on macOS
        if: runner.os == 'macOS'
        run: brew install swig
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev,hdf5]"
      - name: Run quality checks
        run: |
          python -m isort --check-only gmes examples tests utils setup.py
          python -m black --check gmes examples tests utils setup.py
          python -m pylint gmes setup.py
      - name: Run tests
        run: python -m unittest discover -v
      - name: Build distributions
        run: python -m build

  prerelease:
    name: Python prerelease
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.15-dev"
      - name: Install SWIG
        run: sudo apt-get update && sudo apt-get install --yes swig
      - name: Install and test prerelease dependencies
        run: |
          python -m pip install --upgrade --pre pip
          python -m pip install --pre ".[dev,hdf5]"
          python -m unittest discover -v
