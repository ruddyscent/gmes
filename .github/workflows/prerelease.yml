name: Python prerelease (advisory)

# Scientific Python SPEC 4 recommends exercising nightly dependencies on a
# weekly schedule: https://scientific-python.org/specs/spec-0004/

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prerelease-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prerelease:
    name: Python prerelease
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.15-dev"
      - name: Install SWIG
        run: sudo apt-get update && sudo apt-get install --yes swig
      - name: Install nightly dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            --pre \
            --upgrade \
            --only-binary=:all: \
            --extra-index-url https://pypi.anaconda.org/scientific-python-nightly-wheels/simple \
            numpy scipy h5py
          python -m pip install --pre --group dev
      - name: Install GMES
        run: python -m pip install --no-deps -e .
      - name: Run tests
        run: python -m unittest discover -v
