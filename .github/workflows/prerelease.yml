name: Python prerelease (advisory)

# Scientific Python SPEC 4 recommends exercising nightly dependencies on a
# weekly schedule: https://scientific-python.org/specs/spec-0004/

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prerelease-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prerelease:
    name: Python prerelease
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.15-dev"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
          version: "0.12.5"
      - name: Install nightly dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            --pre \
            --upgrade \
            --only-binary=:all: \
            --extra-index-url https://pypi.anaconda.org/scientific-python-nightly-wheels/simple \
            numpy scipy
          python -m pip install --pre --group dev
      - name: Install GMES
        # Optional HDF5 dependencies are covered by the locked Python 3.14 CI;
        # numexpr does not yet provide Python 3.15 wheels.
        run: |
          python -m pip install --pre --only-binary=torch \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            -e .
          python -m pip check
      - name: Run tests
        run: python -m pytest -v
