name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  metadata:
    name: Verify release identity
    runs-on: ubuntu-24.04
    outputs:
      release-title: ${{ steps.identity.outputs.release-title }}
      tag: ${{ steps.identity.outputs.tag }}
      version: ${{ steps.identity.outputs.version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: identity
        name: Match tag, package metadata, and changelog
        run: |
          version="$(tr -d '\n' < VERSION)"
          tag="v${version}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
          fi
          python3 utils/release.py --tag "${tag}"
          {
            echo "version=${version}"
            echo "tag=${tag}"
            echo "release-title=GMES ${version}"
          } >> "${GITHUB_OUTPUT}"

  quality:
    name: Full suite / ${{ matrix.os }}
    needs: metadata
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          version: "0.12.5"
      - name: Install Python
        run: uv python install 3.14
      - name: Install native dependencies on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libopenmpi-dev openmpi-bin swig
      - name: Install native dependencies on macOS
        if: runner.os == 'macOS'
        run: brew install swig
      - name: Install Linux test environment
        if: runner.os == 'Linux'
        run: uv sync --locked --extra hdf5 --extra plot --extra mpi
      - name: Install macOS test environment
        if: runner.os == 'macOS'
        run: uv sync --locked --extra hdf5 --extra plot
      - name: Run quality checks
        run: |
          uv run --no-sync python -m isort --check-only gmes examples tests utils setup.py
          uv run --no-sync python -m black --check gmes examples tests utils setup.py
          uv run --no-sync python -m pylint gmes setup.py
      - name: Run complete unit-test suite
        run: uv run --no-sync python -m unittest discover -v
      - name: Run MPI deployment smoke test
        if: runner.os == 'Linux'
        run: uv run --no-sync mpiexec --oversubscribe -n 10 python tests/mpi_deployment_smoke.py

  build-sdist:
    name: Build and test sdist
    needs: metadata
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          version: "0.12.5"
      - name: Install Python and native build dependencies
        run: |
          uv python install 3.14
          sudo apt-get update
          sudo apt-get install --yes build-essential swig
      - name: Build isolated source distribution
        run: uv build --sdist --clear --out-dir release-dist
      - name: Validate source distribution
        env:
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          python3 utils/release.py --tag "${RELEASE_TAG}" --archive release-dist/*.tar.gz
          uvx --from twine==6.2.0 twine check release-dist/*
      - name: Install and import from the source distribution
        run: |
          uv venv --python 3.14 "${RUNNER_TEMP}/gmes-sdist"
          uv pip install --python "${RUNNER_TEMP}/gmes-sdist/bin/python" release-dist/*.tar.gz
          cd "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/gmes-sdist/bin/python" -c \
            "import gmes, gmes._constant, gmes._pw_material, gmes.material, gmes.pygeom"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distribution-sdist
          path: release-dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  build-wheels:
    name: Build and test wheel / ${{ matrix.platform }}
    needs: metadata
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
          - os: macos-15
            platform: macos-arm64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          version: "0.12.5"
      - name: Install SWIG on macOS
        if: runner.os == 'macOS'
        run: brew install swig
      - name: Build, repair, and smoke-test wheel
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074 # v4.2.0
        with:
          output-dir: wheelhouse
          extras: uv
      - name: Validate wheel metadata and contents
        env:
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          python3 utils/release.py --tag "${RELEASE_TAG}" --archive wheelhouse/*.whl
          uvx --from twine==6.2.0 twine check wheelhouse/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distribution-${{ matrix.platform }}
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 14

  assemble:
    name: Verify collected distributions
    needs:
      - metadata
      - build-sdist
      - build-wheels
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: distribution-*
          path: downloaded-artifacts
      - name: Reject missing, duplicate, or unexpected files
        env:
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          python3 utils/release.py \
            --tag "${RELEASE_TAG}" \
            --collect-dir downloaded-artifacts \
            --dist-dir dist
          uvx --from twine==6.2.0 twine check dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  publish-pypi:
    name: Publish verified files to PyPI
    if: github.ref_type == 'tag'
    needs:
      - metadata
      - quality
      - assemble
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/gmes
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-distributions
          path: dist
      - name: Publish with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
          verbose: true

  verify-pypi:
    name: Verify clean installation from PyPI
    if: github.ref_type == 'tag'
    needs:
      - metadata
      - publish-pypi
    runs-on: ubuntu-24.04

    steps:
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
      - name: Install published wheel into a clean environment
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          uv python install 3.14
          uv venv --python 3.14 "${RUNNER_TEMP}/gmes-pypi"
          for attempt in {1..12}; do
            if uv pip install \
              --python "${RUNNER_TEMP}/gmes-pypi/bin/python" \
              --only-binary :all: \
              --refresh-package gmes \
              "gmes==${VERSION}"; then
              break
            fi
            if [[ "${attempt}" == "12" ]]; then
              exit 1
            fi
            sleep 10
          done
          cd "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/gmes-pypi/bin/python" -c \
            "import gmes, gmes._constant, gmes._pw_material, gmes.material, gmes.pygeom"

  github-release:
    name: Create GitHub Release
    if: github.ref_type == 'tag'
    needs:
      - metadata
      - assemble
      - verify-pypi
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-distributions
          path: dist
      - name: Create release and attach verified distributions
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          RELEASE_TITLE: ${{ needs.metadata.outputs.release-title }}
        run: |
          gh release create "${RELEASE_TAG}" dist/* \
            --generate-notes \
            --title "${RELEASE_TITLE}" \
            --verify-tag
