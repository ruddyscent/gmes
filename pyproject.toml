[build-system]
requires = [
    "setuptools>=77",
    "wheel",
    "Cython>=3.1",
    "numpy>=2.3",
]
build-backend = "setuptools.build_meta"

[project]
name = "gmes"
dynamic = ["version"]
description = "GIST Maxwell's Equations Solver"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.14"
license = "GPL-3.0-or-later"
authors = [
    {name = "Kyungwon Chun", email = "kwchun@gist.ac.kr"},
]
maintainers = [
    {name = "Kyungwon Chun", email = "kwchun@gist.ac.kr"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=2.3",
    "scipy>=1.16",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.10"]
mpi = ["mpi4py>=4"]
hdf5 = ["tables>=3.10"]
all = [
    "matplotlib>=3.10",
    "mpi4py>=4",
    "tables>=3.10",
]

[dependency-groups]
dev = [
    "black>=26.5",
    "build>=1.2",
    "coverage>=7.10",
    "isort>=8.0",
    "pylint>=4.0",
]

[project.urls]
Homepage = "https://github.com/ruddyscent/gmes"
Repository = "https://github.com/ruddyscent/gmes"
Issues = "https://github.com/ruddyscent/gmes/issues"

[tool.uv]
required-version = "==0.12.5"
build-constraint-dependencies = [
    "setuptools==84.0.0",
    "wheel==0.48.0",
    "Cython==3.2.9",
    "numpy==2.5.2",
]
cache-keys = [
    {file = "pyproject.toml"},
    {file = "setup.py"},
    {file = "VERSION"},
    {file = "MANIFEST.in"},
    {file = "build-constraints.txt"},
    {file = "README.md"},
    {file = "utils/macos_build.py"},
    {file = "src/*.cc"},
    {file = "src/*.hh"},
    {file = "src/*.i"},
    {file = "src/*.pyx"},
    {env = "MACOSX_DEPLOYMENT_TARGET"},
]

[tool.setuptools]
packages = ["gmes"]

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.black]
target-version = ["py314"]

[tool.isort]
profile = "black"
py_version = 314
extend_skip = [
    "gmes/constant.py",
    "gmes/pw_material.py",
]

[tool.pylint.main]
py-version = "3.14"
extension-pkg-allow-list = [
    "gmes._constant",
    "gmes._pw_material",
    "gmes.material",
    "gmes.pygeom",
]
ignore-patterns = [
    "^constant\\.py$",
    "^pw_material\\.py$",
]

[tool.pylint.messages_control]
disable = ["all"]
enable = [
    "possibly-used-before-assignment",
    "syntax-error",
    "undefined-variable",
    "used-before-assignment",
]

[tool.cibuildwheel]
build = "cp314-manylinux_x86_64 cp314-macosx_arm64"
environment = {PIP_CONSTRAINT = "$(pwd)/build-constraints.txt"}
test-command = "python -c 'import gmes, gmes._constant, gmes._pw_material, gmes.material, gmes.pygeom'"

[tool.cibuildwheel.linux]
archs = ["x86_64"]
before-all = "dnf install --assumeyes swig"
manylinux-x86_64-image = "manylinux_2_34"
repair-wheel-command = "auditwheel repair -w {dest_dir} {wheel}"

[tool.cibuildwheel.macos]
archs = ["arm64"]
environment = {MACOSX_DEPLOYMENT_TARGET = "11.0"}
repair-wheel-command = "delocate-wheel --require-archs {delocate_archs} -w {dest_dir} -v {wheel}"
