[build-system]
requires = [
    "setuptools>=77",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "gmes"
dynamic = ["version"]
description = "GIST Maxwell's Equations Solver"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.14"
license = "GPL-3.0-or-later"
authors = [
    {name = "Kyungwon Chun", email = "kwchun@gist.ac.kr"},
]
maintainers = [
    {name = "Kyungwon Chun", email = "kwchun@gist.ac.kr"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=2.3",
    "scipy>=1.16",
    "torch>=2.13,<2.14",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.10"]
hdf5 = ["tables>=3.10"]
torch-cpu = ["torch>=2.13,<2.14"]
torch-cu126 = ["torch>=2.13,<2.14"]
torch-cu130 = ["torch>=2.13,<2.14"]
all = [
    "matplotlib>=3.10",
    "tables>=3.10",
]

[dependency-groups]
dev = [
    "black>=26.5",
    "build>=1.2",
    "coverage>=7.10",
    "isort>=8.0",
    "mypy>=1.18.2",
    "pylint>=4.0",
]

[project.urls]
Homepage = "https://github.com/ruddyscent/gmes"
Repository = "https://github.com/ruddyscent/gmes"
Issues = "https://github.com/ruddyscent/gmes/issues"

[tool.uv]
required-version = "==0.12.5"
conflicts = [
    [
        {extra = "torch-cpu"},
        {extra = "torch-cu126"},
        {extra = "torch-cu130"},
    ],
]
build-constraint-dependencies = [
    "setuptools==84.0.0",
    "wheel==0.48.0",
]
cache-keys = [
    {file = "pyproject.toml"},
    {file = "setup.py"},
    {file = "VERSION"},
    {file = "MANIFEST.in"},
    {file = "build-constraints.txt"},
    {file = "README.md"},
]

[tool.uv.sources]
torch = [
    {index = "pytorch-cpu", extra = "torch-cpu"},
    {index = "pytorch-cu126", extra = "torch-cu126"},
    {index = "pytorch-cu130", extra = "torch-cu130"},
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.setuptools]
packages = ["gmes"]

[tool.setuptools.package-data]
gmes = ["py.typed", "constant.pyi"]

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.black]
target-version = ["py314"]
# Byte-pinned #124 historical-test snapshots preserve recorded SHA identities; only these paths are exempt.
force-exclude = '''
/(tests/fixtures/issue124/(generator|historical_probe_loader|package_integration_assertions|self_test)\.py|benchmarks/historical_probes\.py)$
'''

[tool.isort]
profile = "black"
py_version = 314
extend_skip = [
    "tests/fixtures/issue124/generator.py",
    "tests/fixtures/issue124/historical_probe_loader.py",
    "tests/fixtures/issue124/package_integration_assertions.py",
    "tests/fixtures/issue124/self_test.py",
    "benchmarks/historical_probes.py",
]

[tool.mypy]
python_version = "3.14"
files = [
    "gmes",
    "tests/typing/public_api.py",
    "tests/typing/star_import.py",
]
strict = true
extra_checks = true
warn_unreachable = true
warn_unused_configs = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = ["matplotlib", "matplotlib.*"]
ignore_missing_imports = true

[tool.pylint.main]
py-version = "3.14"
load-plugins = [
    "pylint.extensions.docparams",
    "pylint.extensions.docstyle",
]

[tool.pylint.messages_control]
disable = ["all"]
enable = [
    "bad-docstring-quotes",
    "differing-param-doc",
    "docstring-first-line-empty",
    "empty-docstring",
    "missing-any-param-doc",
    "missing-class-docstring",
    "missing-function-docstring",
    "missing-module-docstring",
    "missing-param-doc",
    "missing-raises-doc",
    "missing-return-doc",
    "missing-yield-doc",
    "possibly-used-before-assignment",
    "syntax-error",
    "undefined-variable",
    "useless-param-doc",
    "used-before-assignment",
]
